<section id="page-assignment" class="page">
  <div class="module-hero"><div class="module-left"><div class="module-icon"><span class="material-symbols-rounded">assignment</span></div><div><h2>Penugasan Pegawai</h2><p>Buat tugas baru dan lihat karyawan yang menerima setiap penugasan.</p></div></div><button class="btn gray" onclick="loadAdminAssignments(true)"><span class="material-symbols-rounded" style="font-size:15px">refresh</span> Refresh</button></div>
  <section class="panel"><div class="module-body"><div class="business-grid">
    <div><div class="hint" style="margin-bottom:12px">Isi formulir di bawah untuk memberikan penugasan kepada pegawai tertentu.</div><div class="form-grid">
      <div class="full"><label class="form-label">Pegawai</label><select id="assignmentUid" class="select" style="width:100%"><option value="">Pilih pegawai</option></select></div>
      <div class="full"><label class="form-label">Judul Penugasan</label><input id="assignmentTitle" class="input" style="width:100%" maxlength="150" placeholder="Contoh: Kunjungan lapangan"></div>
      <div><label class="form-label">Tanggal Mulai</label><input id="assignmentStart" class="input" style="width:100%" type="date"></div><div><label class="form-label">Tanggal Selesai</label><input id="assignmentEnd" class="input" style="width:100%" type="date"></div>
      <div><label class="form-label">Prioritas</label><select id="assignmentPriority" class="select" style="width:100%"><option value="NORMAL">Normal</option><option value="TINGGI">Tinggi</option><option value="RENDAH">Rendah</option></select></div><div><label class="form-label">Lokasi</label><input id="assignmentLocation" class="input" style="width:100%" maxlength="200" placeholder="Lokasi"></div>
      <div class="full"><label class="form-label">Deskripsi</label><textarea id="assignmentDescription" class="textarea" maxlength="1000" placeholder="Detail pekerjaan / instruksi..."></textarea></div>
      <div class="full"><label class="form-label">Catatan</label><textarea id="assignmentNotes" class="textarea" maxlength="500" placeholder="Catatan tambahan..."></textarea></div>
    </div><div class="form-actions"><button class="btn gray" onclick="resetAssignmentForm()">Bersihkan</button><button id="createAssignmentBtn" class="btn success" onclick="createAssignment()">Buat Penugasan</button></div></div>
    <div><div class="toolbar" style="margin-bottom:10px"><span id="assignmentInfo" class="hint">Memuat...</span><label style="margin-left:auto;font-size:9px;font-weight:800;color:#69788c;display:flex;gap:5px;align-items:center"><input id="includeCompleted" type="checkbox" onchange="loadAdminAssignments(true)"> Tampilkan selesai</label></div><div class="table-wrap"><table class="table business-table"><thead><tr><th>Karyawan Penerima</th><th>Penugasan</th><th>Tanggal</th><th>Lokasi</th><th>Prioritas</th><th>Status & Bukti</th><th>Aksi</th></tr></thead><tbody id="assignmentBody"></tbody></table></div></div>
  </div></div></section>
</section>
