<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Survey - BAZNAS Sragen</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef5ef;color:#24352b;font-family:Arial,sans-serif}.header{background:#0f8a4b;color:white;padding:20px;text-align:center;font-weight:bold}.card{max-width:1100px;margin:16px auto;background:white;padding:20px;border-radius:14px;box-shadow:0 2px 10px #0002}label{display:block;margin:12px 0 5px;font-weight:600}input,select{width:100%;padding:11px;border:1px solid #ccd5ce;border-radius:8px;font:inherit}button{padding:12px 16px;border:0;border-radius:8px;background:#0f8a4b;color:white;font-weight:bold;cursor:pointer;margin-top:12px}button.secondary{background:#64748b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.status{white-space:pre-wrap;color:#555;font-size:13px;margin-top:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:14px}th{background:#f1f8f3}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{margin:10px;padding:14px}}
</style></head><body><div class="header">ADMINISTRATOR<br>DATA SURVEY BANTUAN BAZNAS KABUPATEN SRAGEN</div>
<div class="card" id="loginCard"><h3>Login Admin</h3><label>Username</label><input id="loginUsername" autocomplete="username"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"><button id="loginBtn">MASUK</button><div id="loginStatus" class="status"></div></div>
<div id="appCard" style="display:none"><div class="card"><span id="userBar"></span> <button class="secondary" id="logoutBtn" style="float:right;margin:0">KELUAR</button></div>
<div class="card"><h3>Rekap Hasil Survey</h3><button id="refreshResultsBtn">MUAT / PERBARUI DATA</button><div id="results" class="status">Klik tombol untuk memuat data survey.</div></div>
<div class="card"><h3>Buat Akun Pengguna</h3><div class="grid"><div><label>Username</label><input id="newUsername"></div><div><label>Nama Lengkap</label><input id="newName"></div><div><label>Role</label><select id="newRole"><option value="Surveyor">Surveyor</option><option value="Admin">Admin</option></select></div></div><label>Password (minimal 8 karakter)</label><input id="newPassword" type="password"><button id="createUserBtn">BUAT AKUN</button><div id="userStatus" class="status"></div></div>
<div class="card"><h3>Ganti Password Admin</h3><div class="grid"><div><label>Password Lama</label><input id="oldPassword" type="password"></div><div><label>Password Baru</label><input id="newPasswordSelf" type="password"></div></div><button id="changePasswordBtn">GANTI PASSWORD</button><div id="passwordStatus" class="status"></div></div></div>
<script>
const GAS_API_URL='https://script.google.com/macros/s/AKfycbzlwoVsE2ShpPN2-U1MBQbBMIOiZ9-6yf682Aj0QNsD8MZZz0UXoO6WcDIfOJKDAjfccA/exec';
const $=id=>document.getElementById(id);let authToken='';let currentUser=null;
function setStatus(id,msg){$(id).textContent=msg}
function api(payload){return new Promise((resolve,reject)=>{const iframe=document.createElement('iframe');const target='adminSubmit_'+Date.now();iframe.name=target;iframe.style.display='none';document.body.appendChild(iframe);const cleanup=()=>{window.removeEventListener('message',onMessage);setTimeout(()=>iframe.remove(),500)};const onMessage=e=>{if(!e.data||e.data.type!=='BAZNAS_SURVEY_RESULT')return;cleanup();resolve(e.data.result)};window.addEventListener('message',onMessage);const form=document.createElement('form');form.method='POST';form.action=GAS_API_URL;form.target=target;form.style.display='none';const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);form.appendChild(input);document.body.appendChild(form);form.submit();form.remove();setTimeout(()=>{cleanup();reject(new Error('Backend tidak memberikan respons. Periksa URL Web App dan deployment.'))},90000)})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('loginBtn').addEventListener('click',async()=>{const b=$('loginBtn');b.disabled=true;setStatus('loginStatus','Memeriksa akun...');try{const r=await api({action:'login',username:$('loginUsername').value,password:$('loginPassword').value});if(!r.success)throw new Error(r.message);if(r.user.role!=='Admin')throw new Error('Halaman ini khusus akun Admin. Gunakan halaman Surveyor.');authToken=r.token;currentUser=r.user;$('loginCard').style.display='none';$('appCard').style.display='block';$('userBar').textContent='Login: '+currentUser.name+' (Admin)';loadResults()}catch(e){setStatus('loginStatus',e.message)}finally{b.disabled=false}});
$('logoutBtn').addEventListener('click',()=>{authToken='';currentUser=null;$('appCard').style.display='none';$('loginCard').style.display='block';$('loginPassword').value=''});
async function loadResults(){try{const r=await api({action:'getResults',token:authToken});if(!r.success)throw new Error(r.message);$('results').innerHTML='<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Nama</th><th>Wilayah</th><th>Penghasilan</th><th>Surveyor</th><th>Skor</th><th>Kategori</th></tr></thead><tbody>'+r.rows.map(x=>'<tr><td>'+esc(x.tanggal)+'</td><td>'+esc(x.nama)+'</td><td>'+esc(x.desa)+' / '+esc(x.kecamatan)+'</td><td>'+esc(x.penghasilan||'-')+'</td><td>'+esc(x.surveyor)+'</td><td>'+esc(x.skor)+' ('+esc(x.persen)+'%)</td><td>'+esc(x.kategori)+'</td></tr>').join('')+'</tbody></table></div>'}catch(e){setStatus('results',e.message)}}
$('refreshResultsBtn').addEventListener('click',loadResults);
$('createUserBtn').addEventListener('click',async()=>{try{const r=await api({action:'createUser',token:authToken,username:$('newUsername').value,name:$('newName').value,password:$('newPassword').value,role:$('newRole').value});if(!r.success)throw new Error(r.message);setStatus('userStatus',r.message);['newUsername','newName','newPassword'].forEach(id=>$(id).value='')}catch(e){setStatus('userStatus',e.message)}});
$('changePasswordBtn').addEventListener('click',async()=>{try{const r=await api({action:'changePassword',token:authToken,oldPassword:$('oldPassword').value,newPassword:$('newPasswordSelf').value});if(!r.success)throw new Error(r.message);setStatus('passwordStatus',r.message);$('oldPassword').value='';$('newPasswordSelf').value=''}catch(e){setStatus('passwordStatus',e.message)}});
</script></body></html>
