<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form Survey Bantuan - BAZNAS Sragen</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef5ef;margin:0;color:#24352b}
.header{background:#0f8a4b;color:#fff;padding:18px;text-align:center;font-weight:bold}
.card{max-width:760px;margin:15px auto;background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 8px #0002}
label{display:block;margin-top:12px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-top:5px;font:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{width:100%;padding:14px;background:#0f8a4b;color:#fff;border:0;border-radius:8px;font-size:16px;margin-top:16px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.location{background:#f1f8f3;border:1px solid #cfe5d5;padding:14px;border-radius:9px;margin-top:12px}
.status{font-size:13px;color:#555;white-space:pre-wrap;margin-top:8px}
.note{font-size:12px;color:#666}

.progress-wrap{display:none;margin-top:14px;background:#edf2ee;border-radius:10px;padding:12px}
.progress-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:8px}
.progress-track{height:10px;background:#dce7df;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:#0f8a4b;border-radius:99px;transition:width .25s ease}
.progress-fill.indeterminate{width:35%;animation:moveProgress 1.2s ease-in-out infinite}
@keyframes moveProgress{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
.cache-indicator{font-size:12px;margin-top:8px;color:#45634f}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:9999;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.modal-box{width:min(420px,100%);background:#fff;border-radius:16px;padding:24px;text-align:center;box-shadow:0 12px 40px #0003}
.modal-icon{width:58px;height:58px;border-radius:50%;background:#e5f6eb;color:#0f8a4b;display:grid;place-items:center;font-size:30px;margin:0 auto 12px}
.modal-box h3{margin:8px 0;color:#176b3d}
.modal-box p{font-size:14px;color:#56645b;line-height:1.5}
.modal-box button{margin-top:10px}

@media(max-width:600px){.grid{grid-template-columns:1fr}.card{margin:10px;padding:14px}}
</style>
</head>
<body>
<div class="header">FORM SURVEY BANTUAN<br>BAZNAS KABUPATEN SRAGEN</div>
<div class="card">
<form id="surveyForm">
<label>Nama Lengkap</label><input name="nama" required maxlength="150">
<div class="grid">
<div><label>Jenis Kelamin</label><select name="jk"><option>Laki-laki</option><option>Perempuan</option></select></div>
<div><label>NIK</label><input name="nik" inputmode="numeric" maxlength="16" pattern="[0-9]{16}" placeholder="16 digit NIK"></div>
</div>
<label>Alamat Lengkap</label><textarea name="alamat" rows="2"></textarea>
<div class="grid">
<div><label>Desa/Kelurahan</label><input name="desa" id="desa" type="text" required placeholder="Masukkan desa/kelurahan"></div>
<div><label>Kecamatan</label><input name="kecamatan" id="kecamatan" type="text" required placeholder="Masukkan kecamatan"></div>
</div>
<div class="grid">
<div><label>SHM Atas Nama</label><select name="shm"><option>Sendiri</option><option>Suami/Istri</option><option>Orang Tua</option><option>Kakek/Nenek</option></select></div>
<div><label>Luas Rumah (m²)</label><input name="luasRumah" type="number" min="0" step="any"></div>
<div><label>Atap</label><select name="atap"><option>Genteng</option><option>Seng</option><option>Asbes</option></select></div>
<div><label>Rangka Atap</label><select name="rangkaAtap"><option>Kayu</option><option>Baja Ringan</option><option>Bambu</option></select></div>
<div><label>Dinding</label><select name="dinding"><option>Tembok</option><option>Papan</option><option>Bambu</option></select></div>
<div><label>Lantai</label><select name="lantai"><option>Keramik</option><option>Semen</option><option>Tanah</option></select></div>
<div><label>Daya Listrik</label><select name="dayaListrik"><option>450 VA</option><option>900 VA</option><option>1300 VA</option></select></div>
<div><label>Sumber Air</label><select name="sumberAir"><option>PDAM</option><option>Sumur</option><option>Sungai</option></select></div>
</div>
<label>Jumlah Jiwa</label><input name="jumlahJiwa" type="number" min="1" step="1">
<div class="location">
<strong>Penanda Lokasi Rumah (GPS)</strong>
<div class="note">Aktifkan GPS/lokasi pada perangkat dan izinkan akses lokasi di browser. Pengambilan lokasi sebaiknya dilakukan di titik rumah.</div>
<button type="button" id="getLocationBtn">AMBIL LOKASI AKURAT</button>
<div id="locationStatus" class="status">Lokasi belum direkam.</div>
<input type="hidden" name="latitude" id="latitude">
<input type="hidden" name="longitude" id="longitude">
<input type="hidden" name="accuracy" id="accuracy">
<input type="hidden" name="locationTime" id="locationTime">
</div>
<label>Foto KTP (maks. 5 MB)</label><input name="fotoKtp" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
<label>Foto KK (maks. 5 MB)</label><input name="fotoKk" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
<label>Foto Rumah Depan (maks. 5 MB)</label><input name="fotoRumahDepan" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
<label>Foto Rumah Samping (maks. 5 MB)</label><input name="fotoRumahSamping" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
<label>Foto Rumah Belakang (maks. 5 MB)</label><input name="fotoRumahBelakang" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
<label>Foto Rumah Dalam (maks. 5 MB)</label><input name="fotoRumahDalam" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
<button type="submit" id="submitBtn">SIMPAN DATA</button>
<div id="formStatus" class="status" role="status"></div>
</form>
</div>
<div class="modal" id="successModal" role="dialog" aria-modal="true" aria-labelledby="successTitle">
 <div class="modal-box">
   <div class="modal-icon">✓</div>
   <h3 id="successTitle">UPLOAD BERKAS SELESAI</h3>
   <p id="successMessage">Data survey dan berkas berhasil disimpan.</p>
   <button type="button" id="closeSuccessModal">SELESAI</button>
 </div>
</div>
<script>
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzlwoVsE2ShpPN2-U1MBQbBMIOiZ9-6yf682Aj0QNsD8MZZz0UXoO6WcDIfOJKDAjfccA/exec';
const $ = id => document.getElementById(id);

function setStatus(id, text) { $(id).textContent = text; }


$('getLocationBtn').addEventListener('click', () => {
  if (!navigator.geolocation) {
    setStatus('locationStatus', 'Browser/perangkat tidak mendukung GPS.'); return;
  }
  const btn = $('getLocationBtn'); btn.disabled = true;
  setStatus('locationStatus', 'Sedang mengambil lokasi GPS... Pastikan izin lokasi aktif.');
  navigator.geolocation.getCurrentPosition(pos => {
    const c = pos.coords;
    $('latitude').value = c.latitude;
    $('longitude').value = c.longitude;
    $('accuracy').value = c.accuracy;
    $('locationTime').value = new Date(pos.timestamp).toISOString();
    const map = `https://www.google.com/maps?q=${c.latitude},${c.longitude}`;
    setStatus('locationStatus', `Lokasi berhasil direkam.
Latitude: ${c.latitude}
Longitude: ${c.longitude}
Perkiraan akurasi: ±${Math.round(c.accuracy)} meter
Peta: ${map}`);
    btn.disabled = false;
  }, err => {
    const messages = {
      1: 'Izin lokasi ditolak. Izinkan akses lokasi pada browser.',
      2: 'Lokasi tidak tersedia. Aktifkan GPS dan coba di area terbuka.',
      3: 'Waktu pengambilan lokasi habis. Coba kembali.'
    };
    setStatus('locationStatus', messages[err.code] || err.message);
    btn.disabled = false;
  }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 });
});

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    if (file.size > 4 * 1024 * 1024) return reject(new Error(file.name + ' melebihi 4 MB.'));
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, data: reader.result });
    reader.onerror = () => reject(new Error('Gagal membaca file ' + file.name));
    reader.readAsDataURL(file);
  });
}

function sendPayloadToAppsScript(payload) {
  return new Promise((resolve, reject) => {
    const iframe = document.createElement('iframe');
    const targetName = 'baznasSubmitFrame_' + Date.now();
    iframe.name = targetName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const cleanup = () => {
      window.removeEventListener('message', onMessage);
      setTimeout(() => iframe.remove(), 1000);
    };
    const onMessage = event => {
      if (!event.data || event.data.type !== 'BAZNAS_SURVEY_RESULT') return;
      cleanup();
      resolve(event.data.result);
    };
    window.addEventListener('message', onMessage);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = GAS_API_URL;
    form.target = targetName;
    form.style.display = 'none';
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(payload);
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
    form.remove();

    setTimeout(() => {
      cleanup();
      reject(new Error('Backend tidak memberikan respons. Periksa URL Web App dan izin deployment.'));
    }, 90000);
  });
}


// Penyimpanan lokal menggunakan IndexedDB: tetap tersedia saat offline/halaman ditutup.
const DB_NAME = 'BaznasSurveyOfflineDB';
const STORE_NAME = 'survey';
const DRAFT_KEY = 'currentDraft';
const QUEUE_KEY = 'pendingUploads';

function openSurveyDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbGet(key) {
  const db = await openSurveyDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    tx.oncomplete = () => db.close();
  });
}
async function dbSet(key, value) {
  const db = await openSurveyDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, key);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}
async function dbDelete(key) {
  const db = await openSurveyDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(key);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

const fileFields = ['fotoKtp','fotoKk','fotoRumahDepan','fotoRumahSamping','fotoRumahBelakang','fotoRumahDalam'];
let savedFiles = {};
let savingDraft = false;
let draftTimer = null;

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({name:file.name, data:reader.result, type:file.type, size:file.size});
    reader.onerror = () => reject(new Error('Gagal membaca file ' + file.name));
    reader.readAsDataURL(file);
  });
}
function currentFields() {
  const data = {};
  for (const [key, value] of new FormData($('surveyForm')).entries()) {
    if (!(value instanceof File)) data[key] = value;
  }
  return data;
}
async function saveDraftNow() {
  if (savingDraft) return;
  savingDraft = true;
  try {
    // File yang sudah dipilih disalin ke IndexedDB agar tetap ada setelah reload/offline.
    for (const name of fileFields) {
      const file = $('surveyForm').elements[name].files[0];
      if (file) {
        if (file.size > 4 * 1024 * 1024) throw new Error(file.name + ' melebihi 4 MB.');
        savedFiles[name] = await readFileAsDataUrl(file);
      }
    }
    await dbSet(DRAFT_KEY, {fields:currentFields(), files:savedFiles, savedAt:new Date().toISOString()});
    $('cacheStatus').textContent = '✓ Draft dan berkas tersimpan di perangkat ini.';
  } catch (err) {
    $('cacheStatus').textContent = 'Cache belum lengkap: ' + err.message;
  } finally {
    savingDraft = false;
  }
}
function scheduleDraftSave() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraftNow, 500);
}
async function restoreDraft() {
  try {
    const draft = await dbGet(DRAFT_KEY);
    if (!draft) return;
    Object.entries(draft.fields || {}).forEach(([name,value]) => {
      const field = $('surveyForm').elements[name];
      if (field && field.type !== 'file') field.value = value;
    });
    savedFiles = draft.files || {};
    $('cacheStatus').textContent = '✓ Draft sebelumnya dipulihkan (' +
      new Date(draft.savedAt).toLocaleString('id-ID') + '). Foto tersimpan dan siap diunggah.';
  } catch (err) {
    $('cacheStatus').textContent = 'Penyimpanan lokal tidak dapat dibuka: ' + err.message;
  }
}
$('surveyForm').addEventListener('input', scheduleDraftSave);
$('surveyForm').addEventListener('change', scheduleDraftSave);
window.addEventListener('online', () => {
  $('cacheStatus').textContent = 'Koneksi kembali. Draft aman; tekan SIMPAN DATA untuk mengunggah.';
});

function setProgress(label, percent, indeterminate=false) {
  $('progressWrap').style.display = 'block';
  $('progressLabel').textContent = label;
  $('progressPercent').textContent = indeterminate ? '...' : percent + '%';
  $('progressFill').classList.toggle('indeterminate', indeterminate);
  $('progressFill').style.width = indeterminate ? '35%' : percent + '%';
}
function hideProgress() {
  $('progressWrap').style.display = 'none';
  $('progressFill').classList.remove('indeterminate');
}
function showSuccess(message) {
  $('successMessage').textContent = message || 'Data survey dan berkas berhasil disimpan.';
  $('successModal').classList.add('show');
}
$('closeSuccessModal').addEventListener('click', () => $('successModal').classList.remove('show'));

async function makePayloadFromDraft() {
  await saveDraftNow();
  const fields = currentFields();
  const files = {};
  for (const name of fileFields) files[name] = savedFiles[name] || null;
  return {...fields, files};
}
async function enqueuePayload(payload) {
  const queue = (await dbGet(QUEUE_KEY)) || [];
  queue.push({payload, queuedAt:new Date().toISOString()});
  await dbSet(QUEUE_KEY, queue);
}
async function uploadPayload(payload) {
  setProgress('Mengirim data dan berkas ke Google Drive...', 35, true);
  const result = await sendPayloadToAppsScript(payload);
  if (!result || !result.success) throw new Error((result && result.message) || 'Data gagal disimpan.');
  setProgress('Upload selesai.', 100);
  return result;
}

// Saat online, coba kirim antrean yang sebelumnya gagal. Tidak menghapus antrean
// sebelum server memberi konfirmasi berhasil.
async function retryQueuedUploads() {
  if (!navigator.onLine) return;
  let queue = (await dbGet(QUEUE_KEY)) || [];
  while (queue.length) {
    const item = queue[0];
    try {
      const result = await sendPayloadToAppsScript(item.payload);
      if (!result || !result.success) break;
      queue.shift();
      await dbSet(QUEUE_KEY, queue);
    } catch (_) { break; }
  }
}
window.addEventListener('online', retryQueuedUploads);

$('surveyForm').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.currentTarget;
  if (!form.reportValidity()) return;
  if (!GAS_API_URL.startsWith('https://script.google.com/macros/s/')) {
    setStatus('formStatus', 'URL backend belum diatur. Isi GAS_API_URL pada index.html.');
    return;
  }
  if (!$('latitude').value || !$('longitude').value) {
    setStatus('formStatus', 'Ambil lokasi GPS terlebih dahulu sebelum menyimpan.');
    return;
  }

  const btn = $('submitBtn');
  btn.disabled = true;
  $('getLocationBtn').disabled = true;
  setProgress('Menyimpan cache formulir dan foto...', 10);
  try {
    const payload = await makePayloadFromDraft();
    if (!navigator.onLine) {
      await enqueuePayload(payload);
      setStatus('formStatus', 'Perangkat sedang offline. Data dan foto sudah masuk antrean lokal. Hubungkan internet, lalu tekan SIMPAN DATA untuk mengunggah.');
      setProgress('Tersimpan offline — menunggu koneksi.', 100);
      return;
    }

    setProgress('Cache aman. Mengunggah ke server...', 25);
    const result = await uploadPayload(payload);
    await dbDelete(DRAFT_KEY);
    await dbDelete(QUEUE_KEY);
    setStatus('formStatus', (result.message || 'Berhasil disimpan.') + ' Nomor baris: ' + (result.row || '-'));
    form.reset();
    savedFiles = {};
    ['latitude','longitude','accuracy','locationTime'].forEach(id => $(id).value = '');
    setStatus('locationStatus', 'Lokasi belum direkam.');
    $('cacheStatus').textContent = 'Upload berhasil. Draft lokal telah dibersihkan.';
    showSuccess('Data survey dan berkas berhasil diunggah. Nomor baris: ' + (result.row || '-'));
  } catch (err) {
    try {
      const payload = await makePayloadFromDraft();
      await enqueuePayload(payload);
      setStatus('formStatus', 'Upload belum berhasil: ' + err.message + '. Data dan foto sudah diamankan dalam antrean lokal. Coba lagi saat koneksi stabil.');
    } catch (cacheErr) {
      setStatus('formStatus', 'Gagal upload dan cache: ' + err.message + ' / ' + cacheErr.message);
    }
  } finally {
    btn.disabled = false;
    $('getLocationBtn').disabled = false;
    if (navigator.onLine) setTimeout(hideProgress, 1800);
  }
});

// Pulihkan draft sebelum pengguna mulai mengisi; cache tidak hilang hanya karena reload.
restoreDraft();


</script>
</body>
</html>
