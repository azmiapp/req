<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#087f5b">
  <title>BCL • BAZNAS Sragen</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="brand-card">
      <div class="brand-mark">BAZNAS</div>
      <div>
        <div class="eyebrow">BAZNAS KABUPATEN SRAGEN</div>
        <h1>Bakti Cinta Lansia</h1>
        <p>Bakti Cinta Lansia • Penyaluran sembako bersama ZMart</p><div class="accent-line"></div>
      </div>
    </section>
    <section class="card auth-card">
      <div class="section-head">
        <div>
          <span class="eyebrow">AKSES APLIKASI</span>
          <h2>Masuk ke aplikasi</h2>
        </div>
      </div>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="username" required placeholder="nama@email.com"></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
        <button class="btn primary full" type="submit">Masuk</button>
      </form>
      <div id="loginMsg" class="notice hidden"></div>
    </section>
    <p class="muted center">V1 • Admin Dashboard & ZMart Deliver</p>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
