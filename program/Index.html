<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Absensi BAZNAS Sragen</title>
<style>
body{font-family:Arial;margin:0;background:#f2f6f3;color:#173b2a}.wrap{max-width:520px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:18px;margin:10px 0;box-shadow:0 2px 10px #0001}input,select,textarea,button{width:100%;padding:12px;margin:5px 0;border-radius:10px;box-sizing:border-box;font-size:15px}input,select,textarea{border:1px solid #ddd}button{border:0;background:#177245;color:white;font-weight:bold}button:disabled{opacity:.45}.secondary{background:#e6f0ea;color:#174b32}.danger{background:#b42318}.hide{display:none}video,img{width:100%;border-radius:14px}img{display:none}.row{display:flex;gap:8px}.row>*{flex:1}.item{padding:10px 0;border-top:1px solid #eee}.small{font-size:12px;color:#667}</style></head><body><div class="wrap">
<div id="login" class="card"><h2>Absensi BAZNAS Sragen</h2><input id="un" placeholder="Username"><input id="pw" type="password" placeholder="Password"><button onclick="login()">MASUK</button></div>
<div id="app" class="hide"><div class="card"><b id="nm"></b><div id="rl" class="small"></div><button class="secondary" onclick="logout()">KELUAR</button></div>
<div class="card"><h3>Absensi Hari Ini</h3><div id="today"></div><video id="video" autoplay playsinline></video><img id="photo"><div class="row"><button class="secondary" onclick="camera()">BUKA KAMERA</button><button class="secondary" id="snap" disabled onclick="take()">AMBIL FOTO</button></div><p id="gps" class="small">GPS belum diambil.</p><div class="row"><button id="masuk" disabled onclick="absen('MASUK')">ABSEN MASUK</button><button id="pulang" disabled onclick="absen('PULANG')">ABSEN PULANG</button></div></div>
<div class="card"><h3>Pengajuan</h3><select id="jenis"><option>CUTI</option><option>IZIN</option><option>SAKIT</option><option>DINAS</option></select><div class="row"><input id="mulai" type="date"><input id="selesai" type="date"></div><textarea id="alasan" placeholder="Alasan"></textarea><input id="lampiran" placeholder="Link lampiran (opsional)"><button onclick="request()">KIRIM PENGAJUAN</button></div>
<div id="ap" class="card hide"><h3>Persetujuan</h3><div id="aplist"></div></div><div id="hist" class="card hide"><h3>Riwayat Absensi</h3><input id="month" type="month"><input id="nik" placeholder="NIK opsional"><button class="secondary" onclick="history()">TAMPILKAN</button><div id="history"></div></div></div></div>
<script>const API="https://script.google.com/macros/s/AKfycbwAx06c0c2tRDtJ-fSWEWGuCurQplwgM5yvelen--uKi7nNt6__EYBRovTuVQXxlXWDdA/exec";const $=id=>document.getElementById(id);
async function call(f,...a){let action=f,params={};if(f==='login')params={username:a[0],password:a[1]};else if(f==='logout'||f==='getDashboard')params={token:a[0]};else if(f==='submitAttendance')params={token:a[0],jenis:a[1],latitude:a[2],longitude:a[3],accuracy:a[4],keterangan:a[5],photoData:a[6]};else if(f==='submitRequest')params={token:a[0],payload:a[1]};else if(f==='approveManager'||f==='approveSdm')params={token:a[0],id:a[1],approved:a[2],note:a[3]};else if(f==='getAttendanceHistory')params={token:a[0],month:a[1],nik:a[2],status:a[3]};else if(f==='getPendingApprovals')params={token:a[0]};else if(f==='getEmployees')params={token:a[0]};else throw Error('API action tidak dikenali: '+f);const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,params})});const j=await r.json();if(!j.ok)throw Error(j.error||'Terjadi kesalahan');return j.data}
async function api(action,params={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,params})});const j=await r.json();if(!j.ok)throw Error(j.error||"Terjadi kesalahan");return j.data}

let token="",me=null,stream=null,data="";
const $=id=>document.getElementById(id);
async function login(){try{let r=await call("login",$("un").value,$("pw").value);token=r.token;me=r.user;$("login").classList.add("hide");$("app").classList.remove("hide");$("nm").textContent=me.nama;$("rl").textContent=me.role+" • "+me.tipe;if(["SDM","ADMIN"].includes(me.role))$("hist").classList.remove("hide");refresh()}catch(e){alert(e.message)}}
async function refresh(){try{let d=await call("getDashboard",token);$("today").innerHTML=d.today.length?d.today.map(x=>x.jenis+" : "+x.jam).join(" • "):"Belum ada absensi";if(d.pending.length){$("ap").classList.remove("hide");$("aplist").innerHTML=d.pending.map(x=>`<div class=item><b>${x.nama}</b><br>${x.jenis} ${x.mulai} s/d ${x.selesai}<br>${x.alasan}<br><button onclick="approve('${x.id}',true)">ACC</button><button class=danger onclick="approve('${x.id}',false)">TOLAK</button></div>`).join("")}else $("ap").classList.add("hide")}catch(e){alert(e.message)}}
async function camera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});$("video").srcObject=stream;$("snap").disabled=false}catch(e){alert("Kamera gagal: "+e.message)}}
function take(){let v=$("video"),c=document.createElement("canvas"),s=Math.min(1,720/v.videoWidth);c.width=v.videoWidth*s;c.height=v.videoHeight*s;c.getContext("2d").drawImage(v,0,0,c.width,c.height);data=c.toDataURL("image/jpeg",.72);$("photo").src=data;$("photo").style.display="block";$("masuk").disabled=$("pulang").disabled=false}
function gps(){return new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(p=>{let x={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};$("gps").textContent=`GPS ${x.lat.toFixed(6)}, ${x.lng.toFixed(6)} ±${Math.round(x.acc)}m`;ok(x)},e=>no(new Error("GPS: "+e.message)),{enableHighAccuracy:true,timeout:15000,maximumAge:0}))}
async function absen(j){try{if(!data)throw Error("Ambil selfie dahulu.");let g=await gps();await call("submitAttendance",token,j,g.lat,g.lng,g.acc,"",data);alert("Absensi berhasil");refresh()}catch(e){alert(e.message)}}
async function request(){try{await call("submitRequest",token,{jenis:$("jenis").value,mulai:$("mulai").value,selesai:$("selesai").value,alasan:$("alasan").value,lampiran:$("lampiran").value});alert("Pengajuan terkirim");refresh()}catch(e){alert(e.message)}}
async function approve(id,ok){try{let note=prompt("Catatan (opsional):")||"";await call(me.role=="MANAJER"?"approveManager":"approveSdm",token,id,ok,note);refresh()}catch(e){alert(e.message)}}
async function history(){try{let d=await call("getAttendanceHistory",token,$("month").value,$("nik").value,"");$("history").innerHTML=d.map(x=>`<div class=item>${x.tanggal} ${x.jam} — ${x.nama}<br>${x.jenis} • ${x.status}</div>`).join("")||"Tidak ada data"}catch(e){alert(e.message)}}
async function logout(){try{await call("logout",token)}catch(e){}location.reload()}
</script></body></html>
