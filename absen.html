<script>
'use strict';

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
'https://script.google.com/macros/s/AKfycbwAx06c0c2tRDtJ-fSWEWGuCurQplwgM5yvelen--uKi7nNt6__EYBRovTuVQXxlXWDdA/exec';

const ACTION_MAP = {
  login:'login',
  logout:'logout',
  getMe:'dashboard',
  getDashboard:'dashboard',
  submitAttendance:'attendance',
  submitRequest:'request',
  getMyRequests:'myRequests',
  getPendingApprovals:'pending',
  approveManager:'managerApproval',
  approveSdm:'sdmApproval',
  getAttendanceHistory:'history',
  getEmployees:'employees'
};

/* =========================================================
   GLOBAL
========================================================= */

let TOKEN = localStorage.getItem('baznas_token') || '';
let ME = null;
let clockTimer = null;
let cameraStream = null;
let selfieData = '';
let dashboardLocation = null;
let apiBusy = false;

/* =========================================================
   HELPER
========================================================= */

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? '')
    .replace(/[&<>"']/g,m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m]));
}

function toast(message){
  const el = $('toast');
  if(!el)return;

  el.textContent = message;
  el.style.display = 'block';

  clearTimeout(el._timer);

  el._timer = setTimeout(()=>{
    el.style.display = 'none';
  },2600);
}

function stopClock(){
  clearInterval(clockTimer);
  clockTimer = null;
}

function stopCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
    cameraStream = null;
  }
}

/* =========================================================
   API
========================================================= */

async function gas(fn,...args){

  if(!API_URL || API_URL.includes('PASTE_')){
    throw new Error('API_URL belum diatur.');
  }

  if(apiBusy){
    throw new Error('Sedang memproses. Tunggu sebentar.');
  }

  const action = ACTION_MAP[fn] || fn;
  let params = {};

  switch(fn){

    case 'login':
      params = {
        username:args[0],
        password:args[1]
      };
      break;

    case 'logout':
    case 'getMe':
    case 'getDashboard':
    case 'getPendingApprovals':
    case 'getEmployees':
      params = {
        token:args[0]
      };
      break;

    case 'submitAttendance':{
      const [token,payload] = args;

      params = {
        token,
        jenis:payload?.jenis || '',
        latitude:payload?.lat || '',
        longitude:payload?.lng || '',
        accuracy:payload?.acc || '',
        keterangan:payload?.keterangan || '',
        photoData:payload?.photoData || ''
      };
      break;
    }

    case 'submitRequest':{
      const [token,payload] = args;

      params = {
        token,
        payload:{
          jenis:payload?.jenis || '',
          mulai:payload?.tglMulai || '',
          selesai:payload?.tglSelesai || '',
          alasan:payload?.alasan || '',
          lampiran:payload?.lampiranUrl || ''
        }
      };
      break;
    }

    case 'approveManager':
    case 'approveSdm':
      params = {
        token:args[0],
        id:args[1],
        approved:args[2],
        note:args[3] || ''
      };
      break;

    case 'getAttendanceHistory':{
      const [token,filter] = args;

      params = {
        token,
        month:filter?.month || '',
        nik:filter?.nik || '',
        status:filter?.status || ''
      };
      break;
    }

    default:
      throw new Error('API action tidak dikenali: '+fn);
  }

  apiBusy = true;

  try{

    const response = await fetch(API_URL,{
      method:'POST',
      headers:{
        'Content-Type':'text/plain;charset=utf-8'
      },
      body:JSON.stringify({
        action,
        params
      }),
      redirect:'follow'
    });

    const text = await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error(
        'Respons server bukan JSON. Periksa Web App Google Apps Script.'
      );
    }

    if(!response.ok || data.ok === false){
      throw new Error(
        data.error ||
        data.message ||
        `Server error (${response.status})`
      );
    }

    return data.data;

  }catch(error){

    if(error.message.includes('Failed to fetch')){
      throw new Error(
        'Tidak dapat terhubung ke server. Periksa koneksi internet dan URL API.'
      );
    }

    throw error;

  }finally{
    apiBusy = false;
  }
}

/* =========================================================
   LOGIN
========================================================= */

function loginView(){

  stopCamera();
  stopClock();

  $('app').innerHTML = `
    <div class="login">
      <div class="loginbox">

        <div class="logo">🏢</div>

        <h2>Teams BAZNAS Sragen</h2>

        <p class="muted" style="text-align:center">
          Sistem Absensi & Administrasi Karyawan
        </p>

        <div class="field">
          <label>Username</label>
          <input
            id="u"
            autocomplete="username"
            placeholder="Masukkan username">
        </div>

        <div class="field">
          <label>Password</label>
          <input
            id="p"
            type="password"
            autocomplete="current-password"
            placeholder="Masukkan password">
        </div>

        <button
          class="wide"
          onclick="doLogin()">
          MASUK
        </button>

        <p class="muted" style="text-align:center;margin-top:14px">
          Gunakan akun yang terdaftar pada sistem.
        </p>

      </div>
    </div>
  `;
}

async function doLogin(){

  const username = $('u')?.value.trim();
  const password = $('p')?.value;

  if(!username || !password){
    toast('Username dan password wajib diisi.');
    return;
  }

  try{

    const result = await gas(
      'login',
      username,
      password
    );

    TOKEN = result.token;

    ME = result.user;

    localStorage.setItem(
      'baznas_token',
      TOKEN
    );

    render();

  }catch(error){

    toast(error.message);

  }
}

/* =========================================================
   BOOT
========================================================= */

async function boot(){

  if(!TOKEN){
    loginView();
    return;
  }

  try{

    const data = await gas(
      'getMe',
      TOKEN
    );

    ME = data.user || data.me || data;

    render();

  }catch(error){

    TOKEN = '';
    ME = null;

    localStorage.removeItem(
      'baznas_token'
    );

    loginView();
  }
}

/* =========================================================
   MAIN APP
========================================================= */

/* =========================================================
   CLOCK
========================================================= */

function startClock(){

  stopClock();

  const update = ()=>{

    const now = new Date();

    const time = $('time');
    const date = $('date');

    if(!time || !date){
      stopClock();
      return;
    }

    time.textContent =
      now.toLocaleTimeString(
        'id-ID'
      );

    date.textContent =
      now.toLocaleDateString(
        'id-ID',
        {
          weekday:'long',
          day:'numeric',
          month:'long',
          year:'numeric'
        }
      );
  };

  update();

  clockTimer = setInterval(
    update,
    1000
  );
}

/* =========================================================
   GPS
========================================================= */

function getGPS(){

  return new Promise(
    (resolve,reject)=>{

      if(!navigator.geolocation){

        reject(
          new Error(
            'Browser tidak mendukung GPS.'
          )
        );

        return;
      }

      navigator.geolocation.getCurrentPosition(

        position=>{

          resolve({
            lat:position.coords.latitude,
            lng:position.coords.longitude,
            acc:position.coords.accuracy
          });

        },

        error=>{

          let message =
            'GPS gagal digunakan.';

          if(error.code === 1){
            message =
              'Izin lokasi ditolak.';
          }

          if(error.code === 2){
            message =
              'Lokasi tidak tersedia.';
          }

          if(error.code === 3){
            message =
              'GPS timeout. Coba lagi.';
          }

          reject(
            new Error(message)
          );
        },

        {
          enableHighAccuracy:true,
          timeout:12000,
          maximumAge:0
        }
      );
    }
  );
}

async function refreshDashboardLocation(){

  const loc = $('loc');
  const detail = $('locationDetail');

  if(!loc || !detail)return;

  loc.textContent =
    'Mencari lokasi...';

  detail.textContent =
    'Meminta akses GPS...';

  try{

    const p = await getGPS();

    dashboardLocation = p;

    loc.textContent =
      `${p.lat.toFixed(6)}, ${p.lng.toFixed(6)} · ±${Math.round(p.acc)} m`;

    detail.innerHTML = `
      Koordinat:
      <b>
        ${p.lat.toFixed(6)},
        ${p.lng.toFixed(6)}
      </b>
      <br>
      <small>
        Akurasi GPS ±${Math.round(p.acc)} meter
      </small>
    `;

  }catch(error){

    dashboardLocation = null;

    loc.textContent =
      'Lokasi tidak tersedia';

    detail.innerHTML =
      '❌ ' +
      esc(error.message) +
      '<br><small>Aktifkan GPS dan izinkan lokasi.</small>';
  }
}

async function startCamera(){

  try{

    stopCamera();

    selfieData = '';

    $('selfieStatus')?.classList.add(
      'hidden'
    );

    if($('inbtn'))
      $('inbtn').disabled = true;

    if($('outbtn'))
      $('outbtn').disabled = true;

    const video = $('camera');

    if(!video)return;

    if(!navigator.mediaDevices?.getUserMedia){

      throw new Error(
        'Kamera tidak didukung browser.'
      );
    }

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:'user'
          },
          width:{
            ideal:640
          },
          height:{
            ideal:853
          }
        },

        audio:false
      });

    video.srcObject =
      cameraStream;

  }catch(error){

    toast(
      'Kamera tidak dapat diakses. ' +
      'Gunakan HTTPS dan izinkan kamera.'
    );
  }
}

function takeSelfie(){

  const video = $('camera');
  const canvas = $('snapshot');

  if(
    !video ||
    !video.srcObject ||
    video.readyState < 2
  ){

    toast(
      'Kamera belum siap.'
    );

    return;
  }

  const maxWidth = 640;

  const scale =
    Math.min(
      1,
      maxWidth / video.videoWidth
    );

  canvas.width =
    Math.round(
      video.videoWidth * scale
    );

  canvas.height =
    Math.round(
      video.videoHeight * scale
    );

  const ctx =
    canvas.getContext('2d');

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  /*
   * Quality 0.65 cukup untuk bukti selfie
   * dan jauh lebih kecil daripada foto full-res.
   */
  selfieData =
    canvas.toDataURL(
      'image/jpeg',
      0.65
    );

  $('selfieStatus')
    ?.classList.remove('hidden');

  if($('inbtn'))
    $('inbtn').disabled = false;

  if($('outbtn'))
    $('outbtn').disabled = false;

  stopCamera();

  toast(
    'Foto selfie berhasil diambil.'
  );
}

function exportCSV(){

  const rows =
    window._history || [];

  if(!rows.length){

    toast(
      'Tidak ada data.'
    );

    return;
  }

  const headers = [
    'TANGGAL',
    'JAM',
    'NIK',
    'NAMA',
    'JENIS',
    'LATITUDE',
    'LONGITUDE',
    'JARAK_KANTOR_M',
    'TIPE_ABSEN',
    'STATUS'
  ];

  const csvRows = [
    headers.join(',')
  ];

  rows.forEach(row=>{

    csvRows.push(
      headers.map(header=>{

        const value =
          String(
            row[header] ?? ''
          ).replace(
            /"/g,
            '""'
          );

        return `"${value}"`;

      }).join(',')
    );
  });

  const blob =
    new Blob(
      [csvRows.join('\n')],
      {
        type:'text/csv;charset=utf-8'
      }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement('a');

  link.href = url;

  link.download =
    'riwayat_absensi.csv';

  document.body.appendChild(link);

  link.click();

  link.remove();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );
}
